name: Publish Last Signal project website

on:
  push:
    branches: [main]
    paths:
      - 'test.html'
      - 'index.html'
      - 'field_artifacts.json'
      - 'game/archive_catalog.json'
      - 'game/videos/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p _site
          cp test.html _site/index.html
          cp test.html _site/field.html
          cp index.html _site/project.html
          cp field_artifacts.json _site/field_artifacts.json
          cp README.md REFERENCES.md AI_DISCLOSURE.md LICENSE LICENSE-MEDIA.md _site/
          mkdir -p _site/game
          cp game/archive_catalog.json _site/game/archive_catalog.json
          if [ -d game/videos ]; then cp -R game/videos _site/videos; fi
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
